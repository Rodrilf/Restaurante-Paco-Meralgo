<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Menú</title>
</head>
<body>

<a href="index">Inicio</a> |
<a href="formulario">Crear plato</a> |
<a href="lista">Menú</a> |

<h1>Detalle del plato</h1>

<div th:if="${plato != null}">
    <ul>
        <p>-------- Plato -----------</p>
        <li th:text="${plato.nombre}"></li>
        <li th:text="${plato.precio}"></li>
        <li th:text="${plato.tipo}"></li>
    </ul>

    <ul>
        <p>-------- Ingredientes ----</p>
        <li th:each="ingrediente : ${plato.ingredientes}"
            th:text="${ingrediente.nombre_ingrediente}"></li>
    </ul>
</div>

<p th:if="${plato == null}">Plato no encontrado</p>

</body>
</html>
